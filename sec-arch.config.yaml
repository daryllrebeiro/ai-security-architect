version: "1.0"
tenantId: "default-tenant"

features:
  # Wave A: Graph-Native Capabilities
  # Task A.1: Attack Path Diffing Between Releases/PRs
  diff:
    enabled: false
    defaultBaseRef: "main"
    closureReasonAnalysis: true
    postPrComment: false

  # Task A.2: Natural-Language Query Interface
  nlQuery:
    enabled: false
    groundingVerification: true
    allowLlmSynthesis: true

  # Task A.3: Purple Team Threat Modeling & Attack Simulation
  purpleTeam:
    enabled: false
    maxHops: 10
    defaultMode: "BIDIRECTIONAL"

  # Task A.4: Policy-as-Code Guardrails & Security Budgets
  policy:
    enabled: false
    maxNewPathsPerPR: 0
    maxRiskScorePerPath: 8.5
    maxCriticalPaths: 0
    grandfatherExisting: true

  # Wave B: Reporting & Risk Translation
  # Task B.1: Regulatory & Compliance Framework Mapping
  compliance:
    enabled: false
    defaultFrameworks:
      - "SOC2"
      - "PCI-DSS-v4"
      - "NIST-800-53"

  # Task B.2: Cost-of-Exploit / FAIR Risk Quantification
  riskQuant:
    enabled: false
    currency: "USD"
    baseForensicCost: 50000
    baseDowntimeCost: 100000
    defaultRecordsEstimate: 50000

  # Task B.3: Historical Dashboard & MTTR Burndown
  dashboard:
    enabled: false
    historyDatabase: ".sec-arch/history.db"
    serverPort: 3000

  # Task B.4: Guided Remediation Playbooks / Runbooks
  runbooks:
    enabled: false
    defaultFormat: "markdown"
    includeRollback: true

  # Wave C: Structural Expansion
  # Task C.1: Dependency & Supply-Chain Graph Layer
  dependencyExtractor:
    enabled: false
    ecosystems:
      - "npm"
      - "maven"
      - "pypi"

  # Task C.2: Multi-Repo / Org-Wide Graph Federation
  federation:
    enabled: false
    conflictStrategy: "UNION"
    strictCanonicalMatching: true

  # Foundation / Hardening Connectors
  cloudConnectors:
    enabled: false
    provider: "AWS"
    region: "us-east-1"
    cacheTtlMinutes: 15

  autonomousAgent:
    enabled: false
    maxIterations: 5
    timeoutSeconds: 120
    maxLlmCalls: 10
    autoApprove: false

  realTimeLsp:
    enabled: false
    debounceMs: 500
    offlineMode: false

  # Wave D: Supply Chain & Data Protection
  # Task D.1: SBOM Generation & Container Lineage
  sbom:
    enabled: false
    format: "cyclonedx"
    enforceCosignSignature: false
    allowedRegistries:
      - "ecr.aws"
      - "gcr.io"
      - "docker.io"

  # Task D.2: Sensitive Data Flow & Lineage Tracing
  dataLineage:
    enabled: false
    trackPii: true
    maxPropagationHops: 8

  # Wave E: Guardrails, Intel & Anomaly Detection
  # Task E.1: IAM Least-Privilege Recommender
  leastPrivilege:
    enabled: false
    minObservabilityScore: 0.7
    declineLowConfidence: true

  # Task E.2: Active Threat Intelligence Enrichment
  threatIntel:
    enabled: false
    stalenessThresholdHours: 48
    enableCisaKev: true
    enableEpss: true

  # Task E.3: Kubernetes Admission Controller
  k8sAdmissionController:
    enabled: false
    port: 8443
    failurePolicy: "Ignore"
    mode: "dry-run"

  # Task E.4: Permission & Infra Change Anomaly Detection
  anomalyDetection:
    enabled: false
    minScansForBaseline: 3
    zScoreThreshold: 2.5
    flagWildcardGrant: true

  # Wave F: Collaboration, Modeling & Governance
  # Task F.1: ChatOps Security Architect Bot
  chatops:
    enabled: false
    platform: "slack"
    port: 3001
    allowPatchApprovals: false
    authorizedUsers: []

  # Task F.2: Executive Risk Briefing Generator
  executiveBriefing:
    enabled: false
    reportingPeriod: "quarterly"
    currency: "USD"
    stripTechnicalJargon: true

  # Task F.3: Interactive "What-If" Remediation Sandbox
  whatIfSandbox:
    enabled: false
    maxHops: 10
    allowDestructiveEvaluation: false

  # Task F.4: Multi-Tenant RBAC & Scoped Views
  accessControl:
    enabled: false
    defaultRole: "VIEWER"
    enforceEnvironmentIsolation: true
    partialDisclosureEnabled: true

  # Wave G: Trust & Verification Depth
  # Task G.1: Secrets Lifecycle & Credential Rotation Tracking
  secretsLifecycle:
    enabled: false
    maxAgeDays: 90
    breachCorrelation:
      enabled: false
      serviceUrl: "https://api.pwnedpasswords.com"
      kAnonymityPrefixLength: 5
      acceptOutboundHashLookup: false

  # Task G.2: Formal Verification / Policy Proof Layer for Crown-Jewel Paths
  formalVerification:
    enabled: false
    maxConfigurationHops: 10
    scopeDisclaimerMandatory: true

  # Wave H: External Reach
  # Task H.1: Continuous Live Validation ("Security Chaos Engineering")
  liveValidation:
    enabled: false
    timeoutMs: 5000
    rateLimitPerSecond: 2
    allowedEndpoints: []

  # Task H.2: Third-Party / Vendor Risk Graph Layer
  vendorRisk:
    enabled: false
    enrichDataFlows: true
    fairLossMultiplierEnabled: true

  # Task H.3: Live Incident Response Correlation (SIEM/EDR Bridge)
  incidentCorrelation:
    enabled: false
    maxTraversalHops: 8
    exactMatchStrict: true

  # Wave I: Organizational & Business-Process Features
  # Task I.1: Cyber Insurance Underwriting Report Export
  insuranceExport:
    enabled: false
    draftAssistantMode: true

  # Task I.2: Security Champion Gamification & Engagement Program
  engagement:
    enabled: false
    allowIndividualAttribution: false
    minRemediationDurationMinutes: 60

  # Task I.3: M&A / Due Diligence Assessment Mode
  dueDiligence:
    enabled: false
    anonymizeDealRoomReport: true

  # Task I.4: Secure Reference Architecture / "Paved Road" Template Generator
  pavedRoad:
    enabled: false
    enforceZeroAttackPathCI: true

  # Task I.5: Orphaned Resource & Stale Access Cleanup
  orphanDetection:
    enabled: false
    dormancyWindowDays: 90

  # Strategic Roadmap Phase 3 Capabilities
  ebpfCorrelator:
    enabled: false
    confidenceThreshold: 0.8
    suggestContainment: true

  prBot:
    enabled: false
    authorName: "AI Security Architect"
    signOff: true

  multiAgentArbitrator:
    enabled: false
    weights:
      securityEfficacy: 1.5
      blastRadiusPenalty: 1.0
      frictionPenalty: 0.8


